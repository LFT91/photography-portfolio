name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build Fatni
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ID: fatni-photography
          NEXT_PUBLIC_SITE_URL: https://www.fatniphotography.com
      - name: Assert public build has no curator routes
        run: ASSERT_PUBLIC_BUILD=1 npx tsx --test src/lib/__tests__/production-routes.test.ts
      - name: Build Ayoub
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ID: ayoub-el-fatni
          NEXT_PUBLIC_SITE_URL: https://ayoub-el-fatni.vercel.app
